workflows:
  koe-testflight:
    name: Koe iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Koe App Store Connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ch.paulo.koe
      xcode: latest
    scripts:
      - name: Extract source and generate the Xcode project
        script: |
          unzip -q Koe-iOS-prototype.zip
          cd Koe-iOS
          brew install xcodegen
          xcodegen generate --spec project.yml
          xcode-project use-profiles
          xcode-project build-ipa --project Koe.xcodeproj --scheme Koe
    artifacts:
      - Koe-iOS/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
