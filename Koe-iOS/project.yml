name: Koe
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: ch.paulo.koe
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Koe:
    type: application
    platform: iOS
    sources:
      - Sources/KoeApp
      - Assets.xcassets
    info:
      properties:
        CFBundleDisplayName: Koe
        CFBundleURLTypes:
          - CFBundleURLName: ch.paulo.koe
            CFBundleURLSchemes:
              - koeapp
        NSMicrophoneUsageDescription: Koe benötigt das Mikrofon, um deine gesprochenen Sätze zu erkennen.
        NSSpeechRecognitionUsageDescription: Koe wandelt deine Sprache auf dem iPhone in Text um, damit sie übersetzt werden kann.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
