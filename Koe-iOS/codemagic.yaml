workflows:
  koe-testflight:
    name: Koe iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Koe App Store Connect
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ch.paulo.koe
      xcode: latest
      vars:
        XCODE_PROJECT: Koe.xcodeproj
        XCODE_SCHEME: Koe
    scripts:
      - name: Install XcodeGen and generate project
        script: |
          brew install xcodegen
          xcodegen generate --spec project.yml
      - name: Configure code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
